# Weekly content-decay scan — official actions only, runs on GitHub's free tier.
# Setup: push this folder to a PRIVATE repo, then add the repo secret
# GSC_SERVICE_ACCOUNT_JSON containing your service-account JSON (SETUP.md step 2).
name: content-decay-scan

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Write service account key from secret
        run: echo "${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}" > config/service-account.json

      - name: Run decay scan
        run: node decay/decay.mjs --config config/properties.json

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: content-decay-out
          path: out/
